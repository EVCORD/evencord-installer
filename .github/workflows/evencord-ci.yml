name: Validate EvenCord installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.2'
      - name: Validate CLI and migration fixtures
        env:
          CGO_ENABLED: '0'
        run: go test -tags cli ./...
      - name: Vet CLI
        env:
          CGO_ENABLED: '0'
        run: go vet -tags cli ./...
